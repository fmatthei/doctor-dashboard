name: Recompute alert files

# Rebuilds today.txt and monday.txt from state.json with the real current date,
# so the scheduled Claude tasks never read stale files.
# Runs every morning, and right away whenever state.json changes.
on:
  schedule:
    # Two times as a safety net: GitHub can delay or skip scheduled runs.
    - cron: "41 6 * * *"    # ~03:41 Santiago (summer)
    - cron: "17 11 * * *"   # ~08:17 Santiago (summer), before the 10:00 Claude tasks
  push:
    branches: [main]
    paths: [state.json, scripts/recompute.py]
  workflow_dispatch:
    inputs:
      mode:
        description: "test = print only, live = commit files"
        default: test
        type: choice
        options: [test, live]

permissions:
  contents: write

concurrency:
  group: recompute
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    env:
      TZ: America/Santiago
    steps:
      - uses: actions/checkout@v4

      - name: Validate state.json
        run: jq -e '.items | length > 0' state.json > /dev/null

      - name: Recompute (test mode prints only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'live' }}
        run: python3 scripts/recompute.py state.json /tmp/out --schema

      - name: Recompute and commit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'live' }}
        run: |
          python3 scripts/recompute.py state.json .
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A today.txt monday.txt alerts digest
          git diff --cached --quiet && echo "No changes" || (git commit -m "Daily recompute $(date +%F)" && git pull --rebase -q && git push)
