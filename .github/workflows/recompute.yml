name: Recompute alert files

# Rebuilds today.txt and monday.txt from state.json with the real current date,
# so the scheduled Claude tasks never read stale files.
on:
  schedule:
    - cron: "17 11 * * *"   # ~08:17 Santiago (summer) / 07:17 (winter), before the 10:00 Claude tasks
  workflow_dispatch:
    inputs:
      mode:
        description: "test = print only, live = commit files"
        default: test
        type: choice
        options: [test, live]

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    env:
      TZ: America/Santiago
      GIST_ID: e456b8a03df2c92ddec907ea977466bc
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch state.json
        # The Gist API returns the latest revision; the raw URL can be served stale from cache.
        run: gh api "gists/$GIST_ID" --jq '.files["state.json"].content' > /tmp/state.json

      - name: Recompute (test mode prints only)
        if: ${{ github.event_name != 'schedule' && inputs.mode != 'live' }}
        run: python3 scripts/recompute.py /tmp/state.json /tmp/out --schema

      - name: Recompute and commit
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'live' }}
        run: |
          python3 scripts/recompute.py /tmp/state.json .
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.txt monday.txt
          git diff --cached --quiet && echo "No changes" || (git commit -m "Daily recompute $(date +%F)" && git push)
