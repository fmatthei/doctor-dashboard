name: Diag Pages fetch
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in doctor-dashboard/status.txt alfa147-dashboard/status.txt; do
            echo "=== $u"; curl -sS -w "HTTP %{http_code}\n" "https://fmatthei.github.io/$u?t=$(date +%s)"
          done
