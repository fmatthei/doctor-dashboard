name: Diag Pages fetch
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "" "?t=$(date +%s)" "?t=1795000000"; do
            echo "=== today.txt$q"; curl -sS -D - "https://fmatthei.github.io/doctor-dashboard/today.txt$q" | grep -iE "^(age|x-cache|last-modified|cache-control)|\|"
          done
